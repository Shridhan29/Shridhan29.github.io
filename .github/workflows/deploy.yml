name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Model pipeline
        run: npm run verify:models

      # Also runs the bundle-budget check (ARCHITECTURE.md §6).
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The browser suites, one job each so they run side by side: wall time is the
  # slowest suite, not the sum. Each builds its own dist/ — they read the
  # production build, and a shared artifact would add an upload and a download
  # per job for about the same time as a build. ubuntu-latest ships Chrome at
  # /usr/bin/google-chrome, which the harness finds; it runs with software GL,
  # so the suites force quality tiers wherever they compare numbers.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [phase2, phase3, phase4, phase5, a11y]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: verify:${{ matrix.suite }}
        run: npm run verify:${{ matrix.suite }}

  deploy:
    # A failing browser suite blocks the deploy, not just the build.
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
